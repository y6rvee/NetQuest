<!DOCTYPE html>
<html lang="id">
<head>
<title>Lab Koding — NetQuest</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF5556'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>⚡</text></svg>">
</head>
<body>
<div class="dash">
  <aside class="sidebar" id="sideBar"></aside>
  <div class="dash-main">
    <div class="topbar" id="topBar"></div>
    <main class="dash-content">
      <div class="page-head"><div><span class="eyebrow">Lab Koding</span><h2>Coba kodemu langsung</h2>
        <p>Edit kode di kiri, tekan <b>Jalankan</b>, dan lihat hasilnya di kanan. Pilih template untuk mulai.</p></div></div>
      <div class="lab-wrap">
        <div class="lab-col">
          <div class="lab-head">
            <button class="chip active" onclick="loadSnippet('html',this)">HTML</button>
            <button class="chip" onclick="loadSnippet('css',this)">CSS</button>
            <button class="chip" onclick="loadSnippet('js',this)">JavaScript</button>
            <button class="chip" onclick="loadSnippet('kosong',this)">Kosong</button>
          </div>
          <textarea id="editor" spellcheck="false" aria-label="Editor kode"></textarea>
          <button class="btn btn-red btn-run" onclick="runCode()">▶ Jalankan Kode</button>
        </div>
        <div class="lab-col">
          <div class="lab-head"><span class="chip active" style="cursor:default">Hasil preview</span></div>
          <iframe class="preview-frame" id="preview" title="preview" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>
    </main>
    <footer class="foot" id="pageFoot"></footer>
  </div>
</div>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>renderDash('lab', 'Lab Koding');</script>
<script src="js/lab.js"></script>
</body>
</html>
